name: Build Custom NanoMethPhase Image

on:
  workflow_dispatch:
    inputs:
      nanomethphase_ref:
        description: "Git ref for vahidAK/NanoMethPhase (branch, tag, or SHA)"
        required: false
        default: "master"
      push_latest:
        description: "Also push :latest tags"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 1"

jobs:
  build-and-push:
    name: Build and push nanomethphase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - default_ref: master
            build_context: .
            dockerfile: docker/nanomethphase.Dockerfile
            image_name: nanomethphase
            build_arg_name: NANOMETHPHASE_REF

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Resolve upstream ref
        id: resolve
        shell: bash
        run: |
          REF_INPUT='${{ github.event.inputs.nanomethphase_ref }}'

          if [[ -z "$REF_INPUT" ]]; then
            REF_INPUT='${{ matrix.default_ref }}'
          fi

          REF_TAG=$(echo "$REF_INPUT" | tr '/:' '--')
          BUILD_DATE=$(date -u +%Y%m%d)
          echo "ref=$REF_INPUT" >> "$GITHUB_OUTPUT"
          echo "ref_tag=$REF_TAG" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Compose Docker tags
        id: tags
        shell: bash
        run: |
          IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}"
          TAGS="${IMAGE_BASE}:${{ steps.resolve.outputs.ref_tag }}"
          TAGS+=$'\n'"${IMAGE_BASE}:${{ steps.resolve.outputs.ref_tag }}-${{ steps.resolve.outputs.build_date }}"
          TAGS+=$'\n'"${IMAGE_BASE}:sha-${GITHUB_SHA}"

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.push_latest }}" == "true" ]]; then
            TAGS+=$'\n'"${IMAGE_BASE}:latest"
          fi

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compose build args
        id: buildargs
        shell: bash
        run: |
          if [[ -n "${{ matrix.build_arg_name }}" ]]; then
            {
              echo "build_args<<EOF"
              echo "${{ matrix.build_arg_name }}=${{ steps.resolve.outputs.ref }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "build_args<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Debug build inputs
        shell: bash
        run: |
          echo "build_context=${{ matrix.build_context }}"
          echo "dockerfile=${{ matrix.dockerfile }}"
          if [[ -f "${{ matrix.dockerfile }}" ]]; then
            echo "dockerfile exists: yes"
            sed -n '1,60p' "${{ matrix.dockerfile }}"
          else
            echo "dockerfile exists: no"
            ls -la
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.build_context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.buildargs.outputs.build_args }}
          provenance: false
          sbom: false

      - name: Smoke test nanomethphase R packages
        shell: bash
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ steps.resolve.outputs.ref_tag }}"
          echo "Testing image: $IMAGE"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" Rscript -e "pkgs <- c('sys','R.utils','DSS','Rsamtools','GenomicRanges','IRanges','S4Vectors','Biobase'); miss <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if (length(miss)) { cat('Missing R packages:', paste(miss, collapse=', '), '\n'); quit(status=1) } else { cat('All required R packages present\n') }"
