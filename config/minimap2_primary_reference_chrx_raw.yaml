sample_table: "config/samples.tsv"
reference_fasta: "resources/reference/GRCh38.primary_assembly.genome.fa"
truth_vcf: "previous_results/OTC3.chrXcalls.vcf"
chrom: "chrX"

outdir: "results/{sample}/benchmarks/minimap2_primary_reference_chrx_raw"
workdir: "work/benchmark_minimap2_primary_reference_chrx_raw"
logdir: "logs/benchmark_minimap2_primary_reference_chrx_raw"

# Primary-assembly reference sweep. This FASTA's contig dictionary exactly
# matches previous_results/OTC3.chrXcalls.vcf, and the first 2.18/map-ont run
# recovered the PAR variants that were missing with the no-alt reference.
minimap2_versions:
  - "2.18--h5bf99c6_0"
  - "2.19--h5bf99c6_0"
  - "2.20--h5bf99c6_0"
  - "2.22--h5bf99c6_0"
  - "2.24--h5bf99c6_0"

minimap2_presets:
  - "map-ont"
  - "asm20"

minimap2_container_by_version:
  "2.18--h5bf99c6_0": "docker://quay.io/biocontainers/minimap2:2.18--h5bf99c6_0"
  "2.19--h5bf99c6_0": "docker://quay.io/biocontainers/minimap2:2.19--h5bf99c6_0"
  "2.20--h5bf99c6_0": "docker://quay.io/biocontainers/minimap2:2.20--h5bf99c6_0"
  "2.22--h5bf99c6_0": "docker://quay.io/biocontainers/minimap2:2.22--h5bf99c6_0"
  "2.24--h5bf99c6_0": "docker://quay.io/biocontainers/minimap2:2.24--h5bf99c6_0"

minimap2_extra_args: ""

samtools_container: "docker://quay.io/biocontainers/samtools:1.23.1--ha83d96e_0"
clair_container: "docker://quay.io/biocontainers/clair:2.1.1--0"
clair_model_dir: "resources/models/clair/ont_122HD34"

clair_threshold: 0.125
clair_min_coverage: 4
clair_extra_args: ""

threads_align: 12
threads_sort: 8
threads_clair: 12

bind_path: "/data/home/sscott@cmri.com.au/Projects/mawj_data_tmp"
