# Core inputs
sample_table: "config/samples.tsv"
# This 194-contig primary assembly matches the contig dictionary in the
# historical OTC3 VCF. In particular, it retains chrY PAR sequence, unlike
# the previously used no-alt analysis set.
reference_fasta: "resources/reference/GRCh38.primary_assembly.genome.fa"
reference_url: "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_38/GRCh38.primary_assembly.genome.fa.gz"

# Minimap2 settings
minimap2:
  preset: "map-ont"

# XIST-focused region 
xist_region:
  chrom: "chrX"
  start: 73813879
  end: 73862026

# SNP filtering prior to phasing and for the XIST subset. This reconstructs
# the published OTC3 chrX filter: biallelic SNPs with QUAL >= 751.
snp_filter:
  min_q: 751
  biallelic_snp_only: true

# Clair2 settings (biocontainers/clair:2.1.1)
clair:
  threshold: 0.125
  min_coverage: 4
  # Optional extra args passed to callVarBam, e.g. "--qual=2".
  # Keep optional args in --key=value form.
  extra_args: ""

# Clair2 ONT model download (auto-fetched by workflow).
# Files contain model.data-00000-of-00001, model.index, model.meta.
clair_model:
  name: "ont_122HD34"
  source_url: "http://www.bio8.cs.hku.hk/clair_models/ont/122HD34.tar"

# NanoMethPhase DMA settings
# Column mapping for methylation-frequency files
# chromosome,start,NumOfAllCalls,NumOfModCalls,MethylFreq
dma:
  columns: "1,2,4,5,7"
  dss_version: "2.58.0"
  rscript: "Rscript"

threads:
  align: 16
  samtools_sort: 16
  clair: 24
  whatshap: 12
  nanopolish: 24
  methyl_call_processor: 12
  nanomethphase_phase: 16
  dma: 4

# Singularity sources (docker:// URIs).
# Validate tags in your environment; adjust if your cluster caches different builds.
containers:
  minimap2: "docker://quay.io/biocontainers/minimap2:2.18--h5bf99c6_0"
  samtools: "docker://quay.io/biocontainers/samtools:1.23.1--ha83d96e_0"
  vcftools: "docker://quay.io/biocontainers/vcftools:0.1.17--pl5321h077b44d_0"
  whatshap: "docker://quay.io/biocontainers/whatshap:2.8--py312hf731ba3_0"
  nanopolish: "docker://quay.io/biocontainers/nanopolish:0.14.0--h5ca1c30_6"
  clair: "docker://quay.io/biocontainers/clair:2.1.1--0"
  nanomethphase: "docker://docker.io/szsctt/nanomethphase:latest"
